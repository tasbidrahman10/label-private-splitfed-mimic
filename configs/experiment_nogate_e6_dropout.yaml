description: >
  Paper Experiment E6 — Honest straggler, no attack.
  Client 2 (Cardiac) chronically misses the aggregation window (30s delay
  exceeds 25s window). Server aggregates with Medical + Surgical only.
  Validates low false-positive rate: Client 2's SNAS stays below quarantine
  threshold despite high staleness because the staleness dampening (1+tau)
  suppresses its anomaly score.
server_url: http://127.0.0.1:8000
auth_token: dev-sfl-token
