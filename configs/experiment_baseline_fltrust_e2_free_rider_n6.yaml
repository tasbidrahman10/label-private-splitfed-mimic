mode: option_b
num_rounds: 10
local_epochs: 1
batch_size: 64
fedavg_every_round: true
description: >
  Paper Experiment E2 (N=6) — Free rider attack on Client 1 (MICU/SICU).
  Client 1 submits random weights of the same shape as its encoder every round.
  No stale clients; all six delays sit inside the 25s window.
  Adversary index matches the E1 n=6 grid (client 1) rather than the n=3 E2
  config (client 2), so both n=6 experiments share one adversary.
  E2 is the setting that separates the aggregators at n=3, so this run puts
  SNAS's actual differentiator on a validly-configured Krum and trimmed mean.
server_url: http://127.0.0.1:8000
auth_token: dev-sfl-token
results_dir: results/baseline_fltrust/e2_free_rider_n6

fedavg_wait_seconds: 120.0

delay_config:
  0: 0
  1: 3
  2: 6
  3: 9
  4: 12
  5: 15

attack_config:
  1:
    type: free_rider
    params: {}
