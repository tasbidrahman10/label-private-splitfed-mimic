mode: option_b
num_rounds: 10
local_epochs: 1
batch_size: 64
fedavg_every_round: true
description: >
  Paper Experiment E3 — Label-flip proxy attack on Client 1 (Surgical).
  Client 1 adds structured Gaussian noise (std 0.3) to every floating-point
  encoder tensor before submitting, the weight-space proxy for training on
  flipped labels. Unlike gradient scaling this leaves the submission norm
  close to honest, so it is a direction anomaly rather than a magnitude one
  and is carried by the SNAS cosine term (beta) rather than the norm term.
  No stale clients. Attack strength is attack_simulator.label_flip_proxy's
  documented default.
server_url: http://127.0.0.1:8000
auth_token: dev-sfl-token
results_dir: results/experiment_e3_label_flip

fedavg_wait_seconds: 120.0

delay_config:
  0: 0
  1: 5
  2: 10

attack_config:
  1:
    type: label_flip_proxy
    params:
      noise_std: 0.3
