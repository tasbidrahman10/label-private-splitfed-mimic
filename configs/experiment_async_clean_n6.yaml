mode: option_b
num_rounds: 10
local_epochs: 1
batch_size: 64
fedavg_every_round: true
description: >
  Async-SplitFed-IR clean run at N=6 (no attacks).
  All six clients submit within the 25s window every round, so the windowed
  rule reduces exactly to synchronous FedAvg over all six encoders. Supplies
  the N=6 reference the AUROC delta column in Section 5.6 is measured against.
server_url: http://127.0.0.1:8000
auth_token: dev-sfl-token
results_dir: results/async_clean_n6

fedavg_wait_seconds: 120.0

delay_config:
  0: 0
  1: 3
  2: 6
  3: 9
  4: 12
  5: 15

attack_config: {}
